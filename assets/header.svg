<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="320" shape-rendering="crispEdges">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Silkscreen:wght@400;700&amp;display=swap');

      .pix-title {
        font-family: 'Press Start 2P', monospace;
        font-size: 24px;
        fill: #00ffcc;
        text-shadow: 3px 3px 0px #ff0055, 6px 6px 0px #1e0038;
      }
      .pix-sub {
        font-family: 'Press Start 2P', monospace;
        font-size: 11px;
        fill: #ffe600;
        letter-spacing: 1px;
      }
      .pix-text {
        font-family: 'Silkscreen', monospace;
        font-size: 14px;
        fill: #f8fafc;
        letter-spacing: 0.5px;
      }
      .pix-accent {
        font-family: 'Silkscreen', monospace;
        font-size: 14px;
        fill: #ff007f;
      }

      /* Animations */
      @keyframes floatChar {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulseHeart {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.15); }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 1; }
      }
      @keyframes coinSpin {
        0% { transform: scaleX(1); }
        50% { transform: scaleX(0.1); }
        100% { transform: scaleX(1); }
      }

      .float-anim { animation: floatChar 3s ease-in-out infinite; }
      .blink-anim { animation: blinkCursor 0.7s step-end infinite; }
      .twinkle-1 { animation: starTwinkle 1.8s ease-in-out infinite; }
      .twinkle-2 { animation: starTwinkle 2.4s ease-in-out infinite 0.7s; }
      .twinkle-3 { animation: starTwinkle 1.5s ease-in-out infinite 1.2s; }
      .heart-anim { animation: pulseHeart 1.2s ease-in-out infinite; transform-origin: 32px 32px; }
    </style>

    <!-- Scanline Pattern for CRT Screen -->
    <pattern id="scanlines" width="100%" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100%" y2="0" stroke="#000000" stroke-width="1.5" opacity="0.4" />
    </pattern>

    <!-- Pixel Dither Gradients -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a051b" />
      <stop offset="40%" stop-color="#190a3a" />
      <stop offset="80%" stop-color="#2c1256" />
      <stop offset="100%" stop-color="#44107a" />
    </linearGradient>
  </defs>

  <!-- Sky Canvas -->
  <rect x="0" y="0" width="900" height="320" fill="url(#skyGrad)" />

  <!-- Pixel Stars / Cyber Sky -->
  <g fill="#00ffff">
    <rect class="twinkle-1" x="60" y="40" width="4" height="4" />
    <rect class="twinkle-2" x="180" y="25" width="6" height="6" fill="#ffe600" />
    <rect class="twinkle-3" x="290" y="60" width="4" height="4" />
    <rect class="twinkle-1" x="420" y="30" width="6" height="6" fill="#ff007f" />
    <rect class="twinkle-2" x="650" y="45" width="4" height="4" />
    <rect class="twinkle-3" x="820" y="35" width="6" height="6" fill="#ffe600" />
    <rect class="twinkle-1" x="740" y="80" width="4" height="4" fill="#00ffcc" />
    <rect class="twinkle-2" x="120" y="90" width="4" height="4" />
    <rect class="twinkle-3" x="520" y="70" width="4" height="4" />
  </g>

  <!-- Distant Pixel Cyber City / Mountain Silhouette -->
  <g fill="#0d0422">
    <rect x="0" y="160" width="70" height="100" />
    <rect x="70" y="180" width="90" height="80" />
    <rect x="160" y="150" width="60" height="110" />
    <rect x="220" y="190" width="100" height="70" />
    <rect x="320" y="165" width="80" height="95" />
    <rect x="400" y="140" width="70" height="120" />
    <rect x="470" y="175" width="90" height="85" />
    <rect x="560" y="155" width="80" height="105" />
    <rect x="640" y="170" width="110" height="90" />
    <rect x="750" y="145" width="80" height="115" />
    <rect x="830" y="180" width="70" height="80" />
    <!-- City Windows (Pixel Lights) -->
    <rect x="25" y="175" width="4" height="6" fill="#ffe600" opacity="0.8" />
    <rect x="45" y="195" width="4" height="6" fill="#00ffff" opacity="0.8" />
    <rect x="180" y="165" width="4" height="6" fill="#ff007f" opacity="0.8" />
    <rect x="195" y="190" width="4" height="6" fill="#ffe600" opacity="0.8" />
    <rect x="425" y="155" width="4" height="6" fill="#00ffff" opacity="0.8" />
    <rect x="440" y="180" width="4" height="6" fill="#ffe600" opacity="0.8" />
    <rect x="770" y="160" width="4" height="6" fill="#ff007f" opacity="0.8" />
  </g>

  <!-- Pixel Cyber Grid Ground (Neon Arcade Horizon) -->
  <g fill="#180736">
    <rect x="0" y="240" width="900" height="80" />
  </g>
  <line x1="0" y1="240" x2="900" y2="240" stroke="#00ffcc" stroke-width="3" />
  <line x1="0" y1="255" x2="900" y2="255" stroke="#ff007f" stroke-width="2" />
  <line x1="0" y1="275" x2="900" y2="275" stroke="#ff007f" stroke-width="1.5" />
  <line x1="0" y1="300" x2="900" y2="300" stroke="#7928ca" stroke-width="1" />
  <!-- Perspective Ground Grid Lines -->
  <line x1="100" y1="240" x2="0" y2="320" stroke="#00ffcc" stroke-width="1" opacity="0.5" />
  <line x1="250" y1="240" x2="160" y2="320" stroke="#00ffcc" stroke-width="1" opacity="0.5" />
  <line x1="400" y1="240" x2="360" y2="320" stroke="#00ffcc" stroke-width="1" opacity="0.5" />
  <line x1="500" y1="240" x2="540" y2="320" stroke="#00ffcc" stroke-width="1" opacity="0.5" />
  <line x1="650" y1="240" x2="740" y2="320" stroke="#00ffcc" stroke-width="1" opacity="0.5" />
  <line x1="800" y1="240" x2="900" y2="320" stroke="#00ffcc" stroke-width="1" opacity="0.5" />

  <!-- ==================== PIXEL ART SPRITES ==================== -->

  <!-- Left: Floating Pixel Wizard & Familiar Cat -->
  <g class="float-anim" transform="translate(45, 120)">
    <!-- Wizard Hat (Purple & Gold) -->
    <rect x="32" y="0" width="16" height="8" fill="#ffe600" />
    <rect x="24" y="8" width="32" height="12" fill="#7928ca" />
    <rect x="16" y="20" width="48" height="12" fill="#7928ca" />
    <rect x="8" y="32" width="64" height="10" fill="#a855f7" />
    <!-- Hat Gold Buckle -->
    <rect x="32" y="28" width="16" height="8" fill="#ffe600" />
    <rect x="36" y="30" width="8" height="4" fill="#000000" />
    
    <!-- Face / Shadow -->
    <rect x="16" y="42" width="48" height="22" fill="#180736" />
    <!-- Glowing Pixel Eyes -->
    <rect x="24" y="48" width="8" height="6" fill="#00ffcc" />
    <rect x="48" y="48" width="8" height="6" fill="#00ffcc" />
    <rect x="26" y="50" width="4" height="2" fill="#ffffff" />
    <rect x="50" y="50" width="4" height="2" fill="#ffffff" />

    <!-- Robe / Body -->
    <rect x="12" y="64" width="56" height="40" fill="#6b21a8" />
    <rect x="20" y="64" width="40" height="40" fill="#7e22ce" />
    <rect x="34" y="64" width="12" height="40" fill="#ffe600" />

    <!-- Magic Staff with Glowing Cyan Crystal -->
    <rect x="74" y="20" width="8" height="84" fill="#78350f" />
    <!-- Crystal Top -->
    <rect x="70" y="10" width="16" height="16" fill="#00ffcc" />
    <rect x="74" y="6" width="8" height="24" fill="#ffffff" />
    <rect x="66" y="14" width="24" height="8" fill="#00ffcc" />

    <!-- Pixel Familiar: 8-Bit Cyber Slime / Cat -->
    <g transform="translate(90, 70)">
      <rect x="4" y="8" width="24" height="22" fill="#ff007f" />
      <rect x="0" y="14" width="32" height="14" fill="#ff007f" />
      <!-- Ears -->
      <rect x="4" y="2" width="6" height="6" fill="#ff007f" />
      <rect x="22" y="2" width="6" height="6" fill="#ff007f" />
      <!-- Eyes -->
      <rect x="6" y="12" width="4" height="6" fill="#ffe600" />
      <rect x="22" y="12" width="4" height="6" fill="#ffe600" />
    </g>
  </g>

  <!-- ==================== MAIN BANNER CONTENT ==================== -->
  <g transform="translate(200, 48)">

    <!-- Top Retro Arcade Pill -->
    <rect x="0" y="0" width="220" height="24" fill="#000000" stroke="#00ffcc" stroke-width="2" />
    <text class="pix-sub" x="12" y="17" fill="#00ffcc">● PLAYER ONE READY</text>

    <!-- Main Nickname / Branding in 3D Pixel Style -->
    <text class="pix-title" x="0" y="62">HOANG LOW CODING</text>
    <text class="pix-sub" x="2" y="86">NGUYEN DUY HOANG // [LVL.99 BACKEND MAGE]</text>

    <!-- Retro Stats HUD Row -->
    <g transform="translate(0, 108)">
      <!-- HP Card -->
      <rect x="0" y="0" width="140" height="44" fill="#000000" stroke="#ff0055" stroke-width="2" />
      <text class="pix-sub" x="10" y="18" fill="#ff0055">HP: 9999</text>
      <!-- Pixel Hearts -->
      <text class="pix-text" x="10" y="36" fill="#ff0055">♥♥♥♥♥</text>

      <!-- MP Card (Coffee Power) -->
      <rect x="150" y="0" width="160" height="44" fill="#000000" stroke="#00ffcc" stroke-width="2" />
      <text class="pix-sub" x="160" y="18" fill="#00ffcc">MP: COFFEE</text>
      <rect x="160" y="26" width="138" height="10" fill="#0d1117" />
      <rect x="162" y="28" width="118" height="6" fill="#00ffcc" />

      <!-- XP Card -->
      <rect x="320" y="0" width="150" height="44" fill="#000000" stroke="#ffe600" stroke-width="2" />
      <text class="pix-sub" x="330" y="18" fill="#ffe600">CLASS: IAM/SSO</text>
      <text class="pix-text" x="330" y="36" fill="#ffffff">RANK: S-TIER</text>
    </g>

    <!-- Dialogue Terminal Box -->
    <g transform="translate(0, 168)">
      <rect x="0" y="0" width="470" height="48" fill="#000000" stroke="#a855f7" stroke-width="2" />
      <!-- Terminal prompt -->
      <text class="pix-text" x="14" y="24">
        &gt; QUEST: <tspan fill="#00ffcc">FORGE DISTRIBUTED SSO &amp; KEYCLOAK</tspan>
      </text>
      <text class="pix-text" x="14" y="40">
        &gt; SUB-QUEST: <tspan fill="#ffe600">VISION AI ENGINE</tspan> <tspan class="blink-anim" fill="#ff007f">█</tspan>
      </text>
    </g>
  </g>

  <!-- Right: 8-Bit Computer Screen with Floating Code -->
  <g transform="translate(710, 48)">
    <rect x="0" y="0" width="155" height="180" fill="#000000" stroke="#00ffcc" stroke-width="3" />
    <rect x="8" y="8" width="139" height="164" fill="#090514" />
    
    <!-- Title bar -->
    <rect x="8" y="8" width="139" height="18" fill="#190a3a" />
    <rect x="12" y="12" width="10" height="10" fill="#ff0055" />
    <rect x="26" y="12" width="10" height="10" fill="#ffe600" />
    <rect x="40" y="12" width="10" height="10" fill="#00ffcc" />

    <!-- Pixel Code lines inside screen -->
    <text class="pix-sub" x="14" y="44" fill="#a855f7" font-size="8">while(alive){</text>
    <text class="pix-sub" x="22" y="62" fill="#00ffcc" font-size="8">code();</text>
    <text class="pix-sub" x="22" y="80" fill="#ffe600" font-size="8">secure();</text>
    <text class="pix-sub" x="22" y="98" fill="#ff007f" font-size="8">coffee++;</text>
    <text class="pix-sub" x="14" y="116" fill="#a855f7" font-size="8">}</text>
    
    <!-- Mini Sword Icon -->
    <g transform="translate(55, 126)">
      <rect x="14" y="0" width="4" height="20" fill="#ffffff" />
      <rect x="8" y="18" width="16" height="4" fill="#ffe600" />
      <rect x="14" y="22" width="4" height="8" fill="#ff0055" />
    </g>
  </g>

  <!-- Arcade Outer Frame & Scanlines Overlay -->
  <rect x="0" y="0" width="900" height="320" fill="url(#scanlines)" pointer-events="none" />
  
  <!-- Outer Beveled Pixel Border -->
  <rect x="0" y="0" width="900" height="6" fill="#00ffcc" />
  <rect x="0" y="314" width="900" height="6" fill="#ff007f" />
  <rect x="0" y="0" width="6" height="320" fill="#00ffcc" />
  <rect x="894" y="0" width="6" height="320" fill="#ff007f" />
</svg>
