<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="340" shape-rendering="crispEdges">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Silkscreen:wght@400;700&amp;display=swap');

      .pk-title { font-family: 'Press Start 2P', monospace; font-size: 13px; fill: #F8F4E3; }
      .pk-sec   { font-family: 'Press Start 2P', monospace; font-size: 10px; fill: #F8F4E3; }
      .pk-item  { font-family: 'Press Start 2P', monospace; font-size: 9px; fill: #102A25; }
      .pk-desc  { font-family: 'Silkscreen', monospace; font-size: 12px; fill: #245744; }
    </style>
  </defs>

  <rect x="2" y="2" width="896" height="336" rx="6" fill="#F4E8C1" stroke="#173D32" stroke-width="3" />
  <rect x="6" y="6" width="888" height="328" rx="4" fill="#F4E8C1" stroke="#245744" stroke-width="1.5" />

  <rect x="6" y="6" width="888" height="34" rx="3" fill="#173D32" />
  <image href="data:image/png;base64," x="14" y="13" width="20" height="20" style="image-rendering: pixelated;" />
  <text class="pk-title" x="42" y="28">🧰 [ TRAINER INVENTORY // TECH STACK ]</text>
  <text class="pk-sec" x="660" y="27" fill="#F4C95D">ITEMS: 20/20 [BAG FULL]</text>

    <!-- Pokéball Controls (Great Ball, Ultra Ball, Poké Ball) -->
  <image href="data:image/png;base64," x="830" y="14" width="18" height="18" style="image-rendering: pixelated;" />
  <image href="data:image/png;base64," x="852" y="14" width="18" height="18" style="image-rendering: pixelated;" />
  <image href="data:image/png;base64," x="874" y="14" width="18" height="18" style="image-rendering: pixelated;" />

  <!-- ROW 1 -->
  <!-- 1. Languages Pocket -->
  <g transform="translate(25, 52)">
    <rect x="0" y="0" width="415" height="124" rx="4" fill="#F4E8C1" stroke="#245744" stroke-width="1.5" />
    <rect x="0" y="0" width="415" height="26" rx="2" fill="#245744" />
    <image href="data:image/png;base64," x="8" y="4" width="18" height="18" style="image-rendering: pixelated;" />
    <text class="pk-sec" x="32" y="18" fill="#F4C95D">ITEM POCKET: LANGUAGES</text>

    <!-- Item 1: TypeScript -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="185" height="36" rx="3" fill="#F8F4E3" stroke="#173D32" stroke-width="1" />
      <image href="data:image/png;base64," x="8" y="8" width="20" height="20" style="image-rendering: pixelated;" />
      <text class="pk-item" x="34" y="16">TYPESCRIPT</text>
      <text class="pk-desc" x="34" y="30">Primary Superpower</text>
    </g>

    <!-- Item 2: JavaScript -->
    <g transform="translate(210, 36)">
      <rect x="0" y="0" width="190" height="36" rx="3" fill="#F8F4E3" stroke="#173D32" stroke-width="1" />
      <image href="data:image/png;base64," x="8" y="8" width="20" height="20" style="image-rendering: pixelated;" />
      <text class="pk-item" x="34" y="16">JAVASCRIPT</text>
      <text class="pk-desc" x="34" y="30">Modern ES6+ Engine</text>
    </g>

    <!-- Item 3: Python -->
    <g transform="translate(12, 80)">
      <rect x="0" y="0" width="185" height="36" rx="3" fill="#F8F4E3" stroke="#173D32" stroke-width="1" />
      <image href="data:image/png;base64," x="8" y="8" width="20" height="20" style="image-rendering: pixelated;" />
      <text class="pk-item" x="34" y="16">PYTHON 3</text>
      <text class="pk-desc" x="34" y="30">Scripts &amp; Automation</text>
