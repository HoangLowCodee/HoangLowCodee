      <image href="data:image/png;base64," x="8" y="8" width="20" height="20" style="image-rendering: pixelated;" />
      <text class="pk-item" x="34" y="16">NESTJS</text>
      <text class="pk-desc" x="34" y="30">Modular Backend</text>
    </g>

    <!-- Item 2: Node.js -->
    <g transform="translate(210, 36)">
      <rect x="0" y="0" width="190" height="36" rx="3" fill="#F8F4E3" stroke="#173D32" stroke-width="1" />
      <image href="data:image/png;base64," x="8" y="8" width="20" height="20" style="image-rendering: pixelated;" />
      <text class="pk-item" x="34" y="16">NODE.JS</text>
      <text class="pk-desc" x="34" y="30">V8 Runtime Engine</text>
    </g>

    <!-- Item 3: Prisma ORM -->
    <g transform="translate(12, 80)">
      <rect x="0" y="0" width="185" height="36" rx="3" fill="#F8F4E3" stroke="#173D32" stroke-width="1" />
      <image href="data:image/png;base64," x="8" y="8" width="20" height="20" style="image-rendering: pixelated;" />
      <text class="pk-item" x="34" y="16">PRISMA ORM</text>
      <text class="pk-desc" x="34" y="30">Type-Safe Client</text>
