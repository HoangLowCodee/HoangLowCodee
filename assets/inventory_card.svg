      <image href="data:image/png;base64," x="8" y="8" width="20" height="20" style="image-rendering: pixelated;" />
      <text class="pk-item" x="34" y="16">TAILWIND CSS</text>
      <text class="pk-desc" x="34" y="30">Modern Styling</text>
    </g>

    <!-- Item 4: shadcn/ui -->
    <g transform="translate(210, 80)">
      <rect x="0" y="0" width="190" height="36" rx="3" fill="#F8F4E3" stroke="#173D32" stroke-width="1" />
      <image href="data:image/png;base64," x="8" y="8" width="20" height="20" style="image-rendering: pixelated;" />
      <text class="pk-item" x="34" y="16">SHADCN/UI</text>
      <text class="pk-desc" x="34" y="30">Accessible UI Lib</text>
    </g>
  </g>

  <!-- 4. Databases, Auth & Tools Pocket -->
  <g transform="translate(460, 194)">
    <rect x="0" y="0" width="415" height="124" rx="4" fill="#F4E8C1" stroke="#245744" stroke-width="1.5" />
    <rect x="0" y="0" width="415" height="26" rx="2" fill="#245744" />
    <image href="data:image/png;base64," x="8" y="4" width="18" height="18" style="image-rendering: pixelated;" />
    <text class="pk-sec" x="32" y="18" fill="#F4C95D">ITEM POCKET: DATABASE &amp; DEV TOOLS</text>

    <!-- Item 1: PostgreSQL -->
    <g transform="translate(12, 36)">
      <rect x="0" y="0" width="185" height="36" rx="3" fill="#F8F4E3" stroke="#173D32" stroke-width="1" />
      <image href="data:image/png;base64," x="8" y="8" width="20" height="20" style="image-rendering: pixelated;" />
      <text class="pk-item" x="34" y="16">POSTGRESQL</text>
      <text class="pk-desc" x="34" y="30">Primary Database</text>
    </g>

    <!-- Item 2: MySQL -->
    <g transform="translate(210, 36)">
      <rect x="0" y="0" width="190" height="36" rx="3" fill="#F8F4E3" stroke="#173D32" stroke-width="1" />
      <image href="data:image/png;base64," x="8" y="8" width="20" height="20" style="image-rendering: pixelated;" />
      <text class="pk-item" x="34" y="16">MYSQL</text>
      <text class="pk-desc" x="34" y="30">Relational Storage</text>
    </g>

    <!-- Item 3: Auth & OAuth -->
    <g transform="translate(12, 80)">
      <rect x="0" y="0" width="185" height="36" rx="3" fill="#F8F4E3" stroke="#173D32" stroke-width="1" />
      <image href="data:image/png;base64," x="8" y="8" width="20" height="20" style="image-rendering: pixelated;" />
      <text class="pk-item" x="34" y="16">AUTH &amp; OAUTH</text>
      <text class="pk-desc" x="34" y="30">JWT &amp; Passport.js</text>
    </g>

    <!-- Item 4: GitHub & VS Code -->
    <g transform="translate(210, 80)">
      <rect x="0" y="0" width="190" height="36" rx="3" fill="#F8F4E3" stroke="#173D32" stroke-width="1" />
      <image href="data:image/png;base64," x="8" y="8" width="20" height="20" style="image-rendering: pixelated;" />
      <text class="pk-item" x="34" y="16">GITHUB &amp; VSC</text>
      <text class="pk-desc" x="34" y="30">Dev Environment</text>
    </g>
