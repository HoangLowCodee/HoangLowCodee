      <image href="data:image/png;base64," x="8" y="8" width="20" height="20" style="image-rendering: pixelated;" />
      <text class="pk-item" x="34" y="16">NEXT.JS</text>
      <text class="pk-desc" x="34" y="30">SSR &amp; App Router</text>
