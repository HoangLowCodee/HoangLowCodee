<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="300" shape-rendering="crispEdges">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Silkscreen:wght@400;700&amp;display=swap');

      .pix-title { font-family: 'Press Start 2P', monospace; font-size: 13px; fill: #ffe600; }
      .pix-cat   { font-family: 'Press Start 2P', monospace; font-size: 9px; fill: #00ffcc; letter-spacing: 0.5px; }
      .pix-item  { font-family: 'Silkscreen', monospace; font-size: 12px; fill: #f8fafc; font-weight: 700; }
      .pix-tier  { font-family: 'Press Start 2P', monospace; font-size: 7px; fill: #94a3b8; }

      @keyframes slotGlow {
        0%, 100% { stroke: #334155; }
        50% { stroke: #00ffcc; }
      }
      .slot { fill: #090514; stroke: #334155; stroke-width: 1.5; }
      .slot-glow { animation: slotGlow 2.5s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="2" y="2" width="896" height="296" fill="#090514" stroke="#ffe600" stroke-width="2" />
  <rect x="6" y="6" width="888" height="288" fill="#0c071d" />

  <!-- Top Title Bar -->
  <rect x="6" y="6" width="888" height="30" fill="#180736" stroke="#ffe600" stroke-width="1" />
  <text class="pix-title" x="20" y="26">🎒 [ INVENTORY &amp; SKILL TREE / TECH STACK ]</text>

  <!-- 4 Categories -->

  <!-- ==================== 1. PRIMARY WEAPONS (Languages) ==================== -->
  <g transform="translate(24, 50)">
    <text class="pix-cat" x="0" y="14">⚔ PRIMARY WEAPONS</text>
    
    <!-- Slots -->
    <g transform="translate(0, 24)">
      <!-- Slot 1: Java (Legendary) -->
      <g transform="translate(0, 0)">
        <rect class="slot" x="0" y="0" width="162" height="40" stroke="#f59e0b" />
        <rect x="6" y="6" width="28" height="28" fill="#1e1035" stroke="#f59e0b" />
        <text class="pix-item" x="14" y="25" fill="#f59e0b">☕</text>
        <text class="pix-item" x="42" y="21">JAVA</text>
        <text class="pix-tier" x="42" y="32" fill="#f59e0b">LVL.MAX</text>
      </g>
      <!-- Slot 2: Python (Epic) -->
      <g transform="translate(172, 0)">
        <rect class="slot" x="0" y="0" width="162" height="40" stroke="#00ffcc" />
        <rect x="6" y="6" width="28" height="28" fill="#1e1035" stroke="#00ffcc" />
        <text class="pix-item" x="14" y="25" fill="#00ffcc">🐍</text>
        <text class="pix-item" x="42" y="21">PYTHON</text>
        <text class="pix-tier" x="42" y="32" fill="#00ffcc">LVL.95</text>
      </g>
      <!-- Slot 3: C++ (Rare) -->
      <g transform="translate(344, 0)">
        <rect class="slot" x="0" y="0" width="162" height="40" stroke="#38bdf8" />
        <rect x="6" y="6" width="28" height="28" fill="#1e1035" stroke="#38bdf8" />
        <text class="pix-item" x="14" y="25" fill="#38bdf8">⚡</text>
        <text class="pix-item" x="42" y="21">C / C++</text>
        <text class="pix-tier" x="42" y="32" fill="#38bdf8">LVL.85</text>
      </g>
      <!-- Slot 4: TypeScript / JS (Rare) -->
      <g transform="translate(516, 0)">
        <rect class="slot" x="0" y="0" width="162" height="40" stroke="#a855f7" />
        <rect x="6" y="6" width="28" height="28" fill="#1e1035" stroke="#a855f7" />
        <text class="pix-item" x="14" y="25" fill="#a855f7">📜</text>
        <text class="pix-item" x="42" y="21">TYPESCRIPT</text>
        <text class="pix-tier" x="42" y="32" fill="#a855f7">LVL.90</text>
      </g>
      <!-- Slot 5: SQL (Epic) -->
      <g transform="translate(688, 0)">
        <rect class="slot" x="0" y="0" width="162" height="40" stroke="#ff007f" />
        <rect x="6" y="6" width="28" height="28" fill="#1e1035" stroke="#ff007f" />
        <text class="pix-item" x="14" y="25" fill="#ff007f">💎</text>
        <text class="pix-item" x="42" y="21">SQL QUERY</text>
        <text class="pix-tier" x="42" y="32" fill="#ff007f">LVL.92</text>
      </g>
    </g>
  </g>

  <!-- ==================== 2. ARMOR & SHIELDS (Backend & Security) ==================== -->
  <g transform="translate(24, 130)">
    <text class="pix-cat" x="0" y="14" fill="#ff0055">🛡 ARMOR &amp; SPELL SHIELDS (BACKEND &amp; IAM)</text>
    
    <g transform="translate(0, 24)">
      <!-- Spring Boot -->
      <g transform="translate(0, 0)">
        <rect class="slot" x="0" y="0" width="162" height="40" stroke="#22c55e" />
        <rect x="6" y="6" width="28" height="28" fill="#1e1035" stroke="#22c55e" />
        <text class="pix-item" x="14" y="25" fill="#22c55e">🍃</text>
        <text class="pix-item" x="42" y="21">SPRING BOOT</text>
        <text class="pix-tier" x="42" y="32" fill="#22c55e">FORTRESS</text>
      </g>
      <!-- Keycloak SSO -->
      <g transform="translate(172, 0)">
        <rect class="slot" x="0" y="0" width="162" height="40" stroke="#ef4444" />
        <rect x="6" y="6" width="28" height="28" fill="#1e1035" stroke="#ef4444" />
        <text class="pix-item" x="14" y="25" fill="#ef4444">🔑</text>
        <text class="pix-item" x="42" y="21">KEYCLOAK</text>
        <text class="pix-tier" x="42" y="32" fill="#ef4444">SSO MASTER</text>
      </g>
      <!-- OAuth2 / OIDC -->
      <g transform="translate(344, 0)">
        <rect class="slot" x="0" y="0" width="162" height="40" stroke="#38bdf8" />
        <rect x="6" y="6" width="28" height="28" fill="#1e1035" stroke="#38bdf8" />
        <text class="pix-item" x="14" y="25" fill="#38bdf8">🛡</text>
        <text class="pix-item" x="42" y="21">OAUTH2 / JWT</text>
        <text class="pix-tier" x="42" y="32" fill="#38bdf8">SHIELD</text>
      </g>
      <!-- FastAPI -->
      <g transform="translate(516, 0)">
        <rect class="slot" x="0" y="0" width="162" height="40" stroke="#14b8a6" />
        <rect x="6" y="6" width="28" height="28" fill="#1e1035" stroke="#14b8a6" />
        <text class="pix-item" x="14" y="25" fill="#14b8a6">⚡</text>
        <text class="pix-item" x="42" y="21">FASTAPI</text>
        <text class="pix-tier" x="42" y="32" fill="#14b8a6">HASTE</text>
      </g>
      <!-- Docker Container -->
      <g transform="translate(688, 0)">
        <rect class="slot" x="0" y="0" width="162" height="40" stroke="#0ea5e9" />
        <rect x="6" y="6" width="28" height="28" fill="#1e1035" stroke="#0ea5e9" />
        <text class="pix-item" x="14" y="25" fill="#0ea5e9">🐳</text>
        <text class="pix-item" x="42" y="21">DOCKER</text>
        <text class="pix-tier" x="42" y="32" fill="#0ea5e9">VESSEL</text>
      </g>
    </g>
  </g>

  <!-- ==================== 3. STORAGE & GEAR (Databases & DevOps) ==================== -->
  <g transform="translate(24, 210)">
    <text class="pix-cat" x="0" y="14" fill="#a855f7">📦 VAULTS, POTIONS &amp; GEAR (DATA &amp; TOOLS)</text>
    
    <g transform="translate(0, 24)">
      <!-- Postgres -->
      <g transform="translate(0, 0)">
        <rect class="slot" x="0" y="0" width="162" height="34" stroke="#60a5fa" />
        <text class="pix-item" x="12" y="22" fill="#60a5fa">🐘 POSTGRESQL</text>
      </g>
      <!-- Redis -->
      <g transform="translate(172, 0)">
        <rect class="slot" x="0" y="0" width="162" height="34" stroke="#f87171" />
        <text class="pix-item" x="12" y="22" fill="#f87171">⚡ REDIS CACHE</text>
      </g>
      <!-- Linux -->
      <g transform="translate(344, 0)">
        <rect class="slot" x="0" y="0" width="162" height="34" stroke="#fbbf24" />
        <text class="pix-item" x="12" y="22" fill="#fbbf24">🐧 LINUX SHELL</text>
      </g>
      <!-- Git -->
      <g transform="translate(516, 0)">
        <rect class="slot" x="0" y="0" width="162" height="34" stroke="#fb923c" />
        <text class="pix-item" x="12" y="22" fill="#fb923c">🌿 GIT VERSION</text>
      </g>
      <!-- Computer Vision -->
      <g transform="translate(688, 0)">
        <rect class="slot" x="0" y="0" width="162" height="34" stroke="#c084fc" />
        <text class="pix-item" x="12" y="22" fill="#c084fc">👁 VISION AI</text>
      </g>
    </g>
  </g>
</svg>

