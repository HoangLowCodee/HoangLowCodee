<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240" shape-rendering="crispEdges">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Silkscreen:wght@400;700&amp;display=swap');

      .tc-title { font-family: 'Press Start 2P', monospace; font-size: 12px; fill: #F5F1E8; }
      .tc-head  { font-family: 'Press Start 2P', monospace; font-size: 9px; fill: #386641; }
      .tc-label { font-family: 'Press Start 2P', monospace; font-size: 8px; fill: #588157; }
      .tc-val   { font-family: 'Silkscreen', monospace; font-size: 13px; fill: #1b2e1e; }
      .tc-gold  { font-family: 'Silkscreen', monospace; font-size: 13px; fill: #b45309; }
      .tc-badge-t { font-family: 'Press Start 2P', monospace; font-size: 8px; fill: #F5F1E8; }

      @keyframes pulseStar {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      .anim-star { animation: pulseStar 2s ease-in-out infinite; transform-origin: center; }
    </style>
  </defs>

  <!-- Trainer Card Background (Classic Emerald / LeafGreen GBA Card) -->
  <rect x="2" y="2" width="896" height="236" rx="8" fill="#F5F1E8" stroke="#386641" stroke-width="3" />
  <rect x="6" y="6" width="888" height="228" rx="6" fill="#F5F1E8" stroke="#588157" stroke-width="1.5" />

  <!-- Top Banner / Title Header -->
  <rect x="6" y="6" width="888" height="34" rx="4" fill="#386641" />
  <text class="tc-title" x="24" y="28">🏆 TRAINER CARD // REGION: VIETNAM [VN]</text>
  
  <!-- Star Rank (5-Star Trainer) -->
  <g class="anim-star" transform="translate(820, 16)">
    <polygon points="12,0 15,8 24,9 17,15 19,24 12,19 5,24 7,15 0,9 9,8" fill="#E9B949" stroke="#b45309" stroke-width="1" />
  </g>

  <!-- ==================== LEFT COLUMN: TRAINER PROFILE ==================== -->
  <g transform="translate(30, 52)">
    <!-- ID NO & NAME -->
    <text class="tc-label" x="0" y="16">IDNo.</text>
    <text class="tc-val" x="70" y="16">19290</text>

    <text class="tc-label" x="220" y="16">NAME :</text>
    <text class="tc-gold" x="280" y="16">HoangLowCoding</text>

    <!-- CLASS & SPECIALTY -->
    <text class="tc-label" x="0" y="44">CLASS:</text>
    <text class="tc-val" x="70" y="44">Full-Stack Trainer // Backend Specialist</text>

    <text class="tc-label" x="0" y="72">GUILD:</text>
    <text class="tc-val" x="70" y="72">Vietnam Dev Community 🇻🇳</text>

    <text class="tc-label" x="0" y="100">POKÉDEX:</text>
    <text class="tc-val" x="90" y="100">Java, Spring Boot, React, Node.js, Docker</text>

    <!-- EXP & STATUS -->
    <text class="tc-label" x="0" y="128">EXP PTS:</text>
    <text class="tc-val" x="90" y="128">999,999 PTS [MAX LEVEL]</text>

    <!-- Dialogue Box at Bottom -->
    <g transform="translate(0, 142)">
      <rect x="0" y="0" width="460" height="30" fill="#ffffff" stroke="#588157" stroke-width="1" />
      <text class="tc-head" x="12" y="20">"Gotta debug 'em all! Deploy with zero errors."</text>
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="520" y1="50" x2="520" y2="225" stroke="#588157" stroke-width="1.5" stroke-dasharray="4 3" />

  <!-- ==================== RIGHT COLUMN: ACTIVE PARTY (POKÉMON TEAM) ==================== -->
  <g transform="translate(545, 50)">
    <rect x="0" y="0" width="325" height="22" fill="#588157" />
    <text class="tc-badge-t" x="14" y="15">POKÉMON PARTY &amp; COMPANIONS</text>

    <!-- 6 Pokémon Party Slots in 2x3 Grid -->
    <!-- Slot 1: Bulbasaur (Java/Spring) -->
    <g transform="translate(0, 32)">
      <rect x="0" y="0" width="155" height="42" fill="#ffffff" stroke="#386641" stroke-width="1" />
      <circle cx="20" cy="21" r="12" fill="#52b788" />
      <text class="tc-head" x="16" y="25" fill="#ffffff" font-size="10">🌿</text>
      <text class="tc-label" x="40" y="16">BULBASAUR</text>
      <text class="tc-val" x="40" y="32" font-size="10">Spring Boot</text>
    </g>

    <!-- Slot 2: Pikachu (JavaScript/React) -->
    <g transform="translate(165, 32)">
      <rect x="0" y="0" width="155" height="42" fill="#ffffff" stroke="#386641" stroke-width="1" />
      <circle cx="20" cy="21" r="12" fill="#E9B949" />
      <text class="tc-head" x="16" y="25" fill="#ffffff" font-size="10">⚡</text>
      <text class="tc-label" x="40" y="16">PIKACHU</text>
      <text class="tc-val" x="40" y="32" font-size="10">React / TS</text>
    </g>

    <!-- Slot 3: Charizard (Docker/DevOps) -->
    <g transform="translate(0, 80)">
      <rect x="0" y="0" width="155" height="42" fill="#ffffff" stroke="#386641" stroke-width="1" />
      <circle cx="20" cy="21" r="12" fill="#D95D39" />
      <text class="tc-head" x="16" y="25" fill="#ffffff" font-size="10">🔥</text>
      <text class="tc-label" x="40" y="16">CHARIZARD</text>
      <text class="tc-val" x="40" y="32" font-size="10">Docker &amp; CI</text>
    </g>

    <!-- Slot 4: Blastoise (PostgreSQL/DB) -->
    <g transform="translate(165, 80)">
      <rect x="0" y="0" width="155" height="42" fill="#ffffff" stroke="#386641" stroke-width="1" />
      <circle cx="20" cy="21" r="12" fill="#3b82f6" />
      <text class="tc-head" x="16" y="25" fill="#ffffff" font-size="10">💧</text>
      <text class="tc-label" x="40" y="16">BLASTOISE</text>
      <text class="tc-val" x="40" y="32" font-size="10">PostgreSQL</text>
    </g>

    <!-- Slot 5: Gengar (Security / IAM) -->
    <g transform="translate(0, 128)">
      <rect x="0" y="0" width="155" height="42" fill="#ffffff" stroke="#386641" stroke-width="1" />
      <circle cx="20" cy="21" r="12" fill="#7928ca" />
      <text class="tc-head" x="16" y="25" fill="#ffffff" font-size="10">🔮</text>
      <text class="tc-label" x="40" y="16">GENGAR</text>
      <text class="tc-val" x="40" y="32" font-size="10">Keycloak / IAM</text>
    </g>

    <!-- Slot 6: Snorlax (System Stability) -->
    <g transform="translate(165, 128)">
      <rect x="0" y="0" width="155" height="42" fill="#ffffff" stroke="#386641" stroke-width="1" />
      <circle cx="20" cy="21" r="12" fill="#0d9488" />
      <text class="tc-head" x="16" y="25" fill="#ffffff" font-size="10">🛡️</text>
      <text class="tc-label" x="40" y="16">SNORLAX</text>
      <text class="tc-val" x="40" y="32" font-size="10">High Availability</text>
    </g>
  </g>
</svg>
